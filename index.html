<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كادر الميدان - البصمة الجغرافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { direction: rtl; }
    </style>
</head>
<body class="bg-slate-900">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-900 text-white p-6 flex flex-col justify-between">
        <!-- الرأس مع مؤشر الاتصال -->
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-emerald-400">كادر الميدان</h2>
                    <p class="text-xs text-slate-400">تطبيق المنسق الميداني</p>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 rounded-lg">
                    <i id="connectionIcon" class="fas fa-wifi text-emerald-400"></i>
                    <span id="connectionText" class="text-xs text-emerald-400">متصل</span>
                </div>
            </div>

            <!-- بطاقة العميل -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-3">
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-medium inline-block">
                    مطلوب زيارته اليوم
                </span>
                <h3 class="text-lg font-bold text-white">سوبرماركت البركة</h3>
                <p class="text-xs text-slate-300 flex items-center gap-1.5">
                    <i class="fas fa-map-pin text-emerald-400"></i>
                    شارع مكة، عمان الغربية
                </p>
                <div class="text-xs text-slate-400 pt-2 border-t border-slate-700">
                    <p>📍 المسافة المسموحة: <span class="text-emerald-400 font-bold">70 متر</span></p>
                    <p>⏰ الفترة الزمنية: <span class="text-emerald-400 font-bold">09:00 ص - 11:00 ص</span></p>
                </div>
            </div>

            <!-- رسالة الحالة -->
            <div id="statusMessage" class="hidden p-4 rounded-xl text-xs flex items-start gap-3 bg-rose-500/20 text-rose-300">
                <i class="fas fa-exclamation-circle mt-0.5"></i>
                <span id="statusText">جاري الفحص...</span>
            </div>
        </div>

        <!-- الزر الرئيسي -->
        <div class="py-6 space-y-4">
            <div id="checkinContainer">
                <button id="checkinBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                    <i class="fas fa-location-arrow"></i>
                    <span>تسجيل البصمة الجغرافية</span>
                </button>
                <p class="text-center text-[10px] text-slate-500 mt-2">
                    ✓ يتم التحقق تلقائياً من GPS والمسافة والجهاز
                </p>
            </div>

            <div id="successContainer" class="hidden">
                <div class="w-full bg-emerald-950 border border-emerald-500/30 text-emerald-400 font-bold py-4 rounded-2xl text-center flex items-center justify-center gap-2">
                    <i class="fas fa-check-circle"></i>
                    <span>تم إثبات الزيارة بنجاح</span>
                </div>
                <button id="retryBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 mt-2">
                    <i class="fas fa-sync"></i>
                    <span>البصمة التالية</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== متغيرات =====
        const clientLat = 31.9539;
        const clientLng = 35.9106;
        const clientRadius = 70; // 70 متر
        let isOnline = navigator.onLine;
        let checkedIn = false;

        // ===== حساب المسافة (Haversine Formula) =====
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000; // نصف قطر الأرض بالمتر
            const φ1 = (lat1 * Math.PI) / 180;
            const φ2 = (lat2 * Math.PI) / 180;
            const Δφ = ((lat2 - lat1) * Math.PI) / 180;
            const Δλ = ((lng2 - lng1) * Math.PI) / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // المسافة بالمتر
        }

        // ===== حفظ البصمة محلياً =====
        function saveOfflineCheckIn(checkInData) {
            try {
                const queue = JSON.parse(localStorage.getItem('offline_check_ins') || '[]');
                queue.push({
                    ...checkInData,
                    timestamp: new Date().toISOString(),
                });
                localStorage.setItem('offline_check_ins', JSON.stringify(queue));
                return true;
            } catch (error) {
                console.error('Failed to save offline:', error);
                return false;
            }
        }

        // ===== التحقق من ربط الجهاز =====
        function verifyDeviceBinding() {
            const userId = 'user-123';
            const stored = localStorage.getItem(`device_${userId}`);
            const currentDevice = navigator.userAgent.substring(0, 50) + screen.width + screen.height;

            if (!stored) {
                localStorage.setItem(`device_${userId}`, currentDevice);
                return true;
            }

            return stored === currentDevice;
        }

        // ===== مراقبة الاتصال =====
        window.addEventListener('online', () => {
            isOnline = true;
            updateConnectionStatus();
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            updateConnectionStatus();
        });

        function updateConnectionStatus() {
            const icon = document.getElementById('connectionIcon');
            const text = document.getElementById('connectionText');

            if (isOnline) {
                icon.className = 'fas fa-wifi text-emerald-400';
                text.textContent = 'متصل';
            } else {
                icon.className = 'fas fa-wifi-slash text-amber-400';
                text.textContent = 'بدون نت';
            }
        }

        // ===== دالة البصمة الرئيسية =====
        function handleCheckIn() {
            const btn = document.getElementById('checkinBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الفحص...</span>';

            // التحقق من ربط الجهاز
            if (!verifyDeviceBinding()) {
                showStatus('❌ خطأ: هذا الحساب مربوط بجهاز آخر فقط!', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const distance = calculateDistance(latitude, longitude, clientLat, clientLng);

                        if (distance <= clientRadius) {
                            const checkInData = {
                                user_id: 'user-123',
                                company_id: 'company-1',
                                client_id: 'client-1',
                                latitude: latitude,
                                longitude: longitude,
                                distance_from_target: Math.round(distance),
                                is_valid: true,
                                check_in_time: new Date().toISOString(),
                            };

                            // حفظ محلياً
                            saveOfflineCheckIn(checkInData);

                            showStatus(`✅ تمت البصمة بنجاح! (المسافة: ${Math.round(distance)} متر)`, 'success');
                            showSuccessUI();
                        } else {
                            showStatus(`❌ فشلت البصمة: أنت تبعد ${Math.round(distance)} متر (المسموح 70 متر فقط)`, 'error');
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
                        }
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        showStatus('❌ خطأ: فعّل خدمة الـ GPS على الهاتف', 'error');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0,
                    }
                );
            } else {
                showStatus('❌ متصفحك لا يدعم تتبع الموقع الجغرافي', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');

            statusText.textContent = message;
            statusDiv.className = `p-4 rounded-xl text-xs flex items-start gap-3 ${
                type === 'success' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
            }`;
            statusDiv.classList.remove('hidden');
        }

        function showSuccessUI() {
            document.getElementById('checkinContainer').classList.add('hidden');
            document.getElementById('successContainer').classList.remove('hidden');
        }

        function handleRetry() {
            document.getElementById('checkinContainer').classList.remove('hidden');
            document.getElementById('successContainer').classList.add('hidden');
            document.getElementById('statusMessage').classList.add('hidden');
            const btn = document.getElementById('checkinBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
        }

        // ===== Event Listeners =====
        document.getElementById('checkinBtn').addEventListener('click', handleCheckIn);
        document.getElementById('retryBtn').addEventListener('click', handleRetry);

        // ===== تحديث حالة الاتصال عند التحميل =====
        updateConnectionStatus();
    </script>
</body>
</html>
