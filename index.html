<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كادر الميدان - البصمة الجغرافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { direction: rtl; }
    </style>
</head>
<body class="bg-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-slate-900 text-white p-6 flex flex-col justify-between">
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-emerald-400">كادر الميدان</h2>
                    <p class="text-xs text-slate-400">تطبيق المنسق الميداني</p>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 rounded-lg">
                    <i id="connIcon" class="fas fa-wifi text-emerald-400"></i>
                    <span id="connText" class="text-xs text-emerald-400">متصل</span>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-3">
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-medium inline-block">
                    مطلوب زيارته اليوم
                </span>
                <h3 class="text-lg font-bold text-white">سوبرماركت البركة</h3>
                <p class="text-xs text-slate-300 flex items-center gap-1.5">
                    <i class="fas fa-map-pin text-emerald-400"></i>
                    شارع مكة، عمان الغربية
                </p>
                <div class="text-xs text-slate-400 pt-2 border-t border-slate-700">
                    <p>📍 المسافة المسموحة: <span class="text-emerald-400 font-bold">70 متر</span></p>
                    <p>⏰ الفترة الزمنية: <span class="text-emerald-400 font-bold">09:00 ص - 11:00 ص</span></p>
                </div>
            </div>

            <div id="statusMsg" class="hidden p-4 rounded-xl text-xs flex items-start gap-3 bg-rose-500/20 text-rose-300">
                <i class="fas fa-exclamation-circle mt-0.5"></i>
                <span id="statusTxt">جاري الفحص...</span>
            </div>
        </div>

        <div class="py-6 space-y-4">
            <div id="checkinUI">
                <button id="checkinBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                    <i class="fas fa-location-arrow"></i>
                    <span>تسجيل البصمة الجغرافية</span>
                </button>
                <p class="text-center text-[10px] text-slate-500 mt-2">
                    ✓ يتم التحقق تلقائياً من GPS والمسافة
                </p>
            </div>

            <div id="successUI" class="hidden">
                <div class="w-full bg-emerald-950 border border-emerald-500/30 text-emerald-400 font-bold py-4 rounded-2xl text-center flex items-center justify-center gap-2">
                    <i class="fas fa-check-circle"></i>
                    <span>تم إثبات الزيارة بنجاح</span>
                </div>
                <a href="dashboard.html" class="block w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all text-center mt-2">
                    <i class="fas fa-chart-bar"></i> لوحة الإدارة
                </a>
                <button id="retryBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl mt-2">
                    <i class="fas fa-sync"></i> بصمة جديدة
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dehpydbvqlopmlvumnyk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MBzgBNGkU73B6gZLqNQPYA_sxloatIX';
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const clientLat = 31.9961, clientLng = 35.8569, radius = 70;
        let isOnline = navigator.onLine;

        function calcDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000, φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function saveCheckIn(data) {
            try {
                await db.from('check_ins').insert([{
                    company_id: 'company-1',
                    user_id: 'user-123',
                    client_id: 'client-1',
                    latitude: data.lat,
                    longitude: data.lng,
                    distance_from_target: data.dist,
                    is_valid: data.valid,
                    is_mock_location: false
                }]);
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        window.addEventListener('online', () => { isOnline = true; updateConn(); });
        window.addEventListener('offline', () => { isOnline = false; updateConn(); });

        function updateConn() {
            const icon = document.getElementById('connIcon');
            const text = document.getElementById('connText');
            if (isOnline) {
                icon.className = 'fas fa-wifi text-emerald-400';
                text.textContent = 'متصل';
            } else {
                icon.className = 'fas fa-wifi-slash text-amber-400';
                text.textContent = 'بدون نت';
            }
        }

        function showStatus(msg, type) {
            const div = document.getElementById('statusMsg');
            const txt = document.getElementById('statusTxt');
            txt.textContent = msg;
            div.className = `p-4 rounded-xl text-xs flex items-start gap-3 ${type === 'success' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`;
            div.classList.remove('hidden');
        }

        function showSuccess() {
            document.getElementById('checkinUI').classList.add('hidden');
            document.getElementById('successUI').classList.remove('hidden');
        }

        async function handleCheckIn() {
            const btn = document.getElementById('checkinBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الفحص...</span>';

            if (!navigator.geolocation) {
                showStatus('❌ الهاتف ما يدعم GPS', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const dist = calcDistance(pos.coords.latitude, pos.coords.longitude, clientLat, clientLng);
                if (dist <= radius) {
                    await saveCheckIn({ lat: pos.coords.latitude, lng: pos.coords.longitude, dist: Math.round(dist), valid: true });
                    showStatus(`✅ نجاح! (${Math.round(dist)} متر)`, 'success');
                    showSuccess();
                } else {
                    showStatus(`❌ خطأ: أنت بعيد ${Math.round(dist)} متر`, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
                }
            }, () => {
                showStatus('❌ فعّل GPS على الهاتف', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function handleRetry() {
            document.getElementById('checkinUI').classList.remove('hidden');
            document.getElementById('successUI').classList.add('hidden');
            document.getElementById('statusMsg').classList.add('hidden');
            const btn = document.getElementById('checkinBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-location-arrow"></i><span>تسجيل البصمة الجغرافية</span>';
        }

        document.getElementById('checkinBtn').addEventListener('click', handleCheckIn);
        document.getElementById('retryBtn').addEventListener('click', handleRetry);
        updateConn();
    </script>
</body>
</html>
