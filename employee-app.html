<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البصمة الجغرافية - كادر الميدان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { direction: rtl; }
        .gradient-text { background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #map { height: 300px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 text-white">
    
    <div class="max-w-2xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-4">
                <i class="fas fa-map-location-dot text-emerald-400 text-3xl"></i>
                <h1 class="text-3xl font-bold gradient-text">كادر الميدان</h1>
            </div>
            <p class="text-slate-300">البصمة الجغرافية</p>
        </div>

        <!-- Location Selector -->
        <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 mb-6">
            <label class="block text-sm font-bold mb-3">اختر الموقع</label>
            <select id="locationSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                <option value="">جاري تحميل المواقع...</option>
            </select>
        </div>
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm">المستخدم</p>
                    <h2 class="text-2xl font-bold" id="userName">جاري التحميل...</h2>
                </div>
                <div class="text-right">
                    <p class="text-slate-400 text-sm">الوقت الحالي</p>
                    <p class="text-2xl font-bold" id="currentTime">--:--:--</p>
                </div>
            </div>
        </div>

        <!-- Connection Status -->
        <div class="flex items-center justify-center gap-2 mb-6 p-3 bg-slate-800/50 rounded-lg border border-slate-700">
            <i id="connIcon" class="fas fa-wifi text-emerald-400"></i>
            <span id="connText" class="text-emerald-400 font-bold">متصل</span>
        </div>

        <!-- Map -->
        <div id="map" class="border border-slate-700"></div>

        <!-- Today's Work Info -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-center">
                <p class="text-slate-400 text-sm">وقت الدخول</p>
                <p class="text-2xl font-bold text-emerald-400" id="checkInTime">--:--</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-center">
                <p class="text-slate-400 text-sm">وقت الخروج</p>
                <p class="text-2xl font-bold text-orange-400" id="checkOutTime">--:--</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-center">
                <p class="text-slate-400 text-sm">ساعات العمل</p>
                <p class="text-2xl font-bold text-blue-400" id="workHours">0 ساعة</p>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMsg" class="hidden mb-6 p-4 rounded-xl flex items-start gap-3 bg-rose-500/20 text-rose-300 border border-rose-500">
            <i class="fas fa-exclamation-circle mt-0.5"></i>
            <span id="statusText">جاري الفحص...</span>
        </div>

        <!-- Success Message -->
        <div id="successMsg" class="hidden mb-6 p-4 rounded-xl flex items-start gap-3 bg-emerald-500/20 text-emerald-300 border border-emerald-500">
            <i class="fas fa-check-circle mt-0.5"></i>
            <span id="successText">تم تسجيل البصمة بنجاح!</span>
        </div>

        <!-- Check-in/Check-out Buttons -->
        <div id="actionButtons" class="space-y-4 mb-6">
            <button id="checkInBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-lg">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول (البصمة)</span>
            </button>
            
            <button id="checkOutBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-lg disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-sign-out-alt"></i>
                <span>تسجيل الخروج (البصمة)</span>
            </button>
        </div>

        <!-- Today's Check-ins Log -->
        <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-6">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-history text-emerald-400"></i>
                سجل البصمات اليوم
            </h3>
            
            <div id="checkinsLog" class="space-y-3">
                <p class="text-slate-400 text-center py-6">لا توجد بصمات اليوم</p>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="mt-6">
            <button id="logoutBtn" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500 font-bold py-3 rounded-xl transition">
                <i class="fas fa-sign-out-alt ml-2"></i> تسجيل الخروج من الحساب
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dehpydbvqlopmlvumnyk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MBzgBNGkU73B6gZLqNQPYA_sxloatIX';
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let map = null;
        let userMarker = null;
        let clientLocation = { lat: 31.9961, lng: 35.8569 }; // افتراضي
        let geofenceRadius = 70; // بالمتر
        let isOnline = navigator.onLine;
        let todayCheckIns = [];
        let allLocations = [];

        // Load Locations from Supabase
        async function loadLocations() {
            try {
                if (!currentUser || !currentUser.company_id) return;

                const { data } = await db.from('locations').select('*').eq('company_id', currentUser.company_id);
                allLocations = data || [];

                const select = document.getElementById('locationSelect');
                select.innerHTML = '';

                if (!allLocations.length) {
                    select.innerHTML = '<option value="">لا توجد مواقع</option>';
                    return;
                }

                allLocations.forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc.id;
                    option.textContent = loc.name;
                    option.dataset.lat = loc.latitude;
                    option.dataset.lng = loc.longitude;
                    option.dataset.radius = loc.radius;
                    select.appendChild(option);
                });

                // اختر أول موقع افتراضياً
                if (allLocations.length > 0) {
                    select.value = allLocations[0].id;
                    updateLocationOnMap(allLocations[0]);
                }
            } catch (e) {
                console.error('Load locations error:', e);
            }
        }

        // Update Location on Map
        function updateLocationOnMap(location) {
            clientLocation = { lat: location.latitude, lng: location.longitude };
            geofenceRadius = location.radius;

            // Remove old marker
            if (map) {
                map.eachLayer(layer => {
                    if (layer instanceof L.CircleMarker || layer instanceof L.Circle) {
                        map.removeLayer(layer);
                    }
                });
            }

            // Add client location marker
            L.circleMarker([clientLocation.lat, clientLocation.lng], {
                radius: 8,
                fillColor: '#10b981',
                color: '#10b981',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup(`${location.name}`);

            // Add geofence circle
            L.circle([clientLocation.lat, clientLocation.lng], {
                radius: geofenceRadius,
                color: '#10b981',
                weight: 2,
                opacity: 0.3,
                fill: true,
                fillColor: '#10b981',
                fillOpacity: 0.1
            }).addTo(map);

            map.setView([clientLocation.lat, clientLocation.lng], 15);
        }

        // Location Select Change
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('locationSelect');
            if (select) {
                select.addEventListener('change', () => {
                    const selectedOption = select.options[select.selectedIndex];
                    if (selectedOption.value) {
                        const location = allLocations.find(loc => loc.id === selectedOption.value);
                        if (location) {
                            updateLocationOnMap(location);
                        }
                    }
                });
            }
        });

        // Initialize Map
        function initMap() {
            map = L.map('map').setView([31.9961, 35.8569], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        // Update User Location on Map
        function updateUserLocationOnMap(latitude, longitude) {
            if (userMarker) {
                map.removeLayer(userMarker);
            }
            userMarker = L.circleMarker([latitude, longitude], {
                radius: 10,
                fillColor: '#3b82f6',
                color: '#3b82f6',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('موقعك الحالي');
            
            map.setView([latitude, longitude], 15);
        }

        // Calculate Distance
        function calcDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Save Check-in to Supabase
        async function saveCheckIn(checkInData) {
            try {
                const { error } = await db.from('check_ins').insert([{
                    company_id: currentUser.company_id,
                    user_id: currentUser.id,
                    client_id: 'client-1',
                    latitude: checkInData.lat,
                    longitude: checkInData.lng,
                    distance_from_target: Math.round(checkInData.dist),
                    is_valid: checkInData.valid,
                    is_mock_location: false,
                    check_in_time: new Date().toISOString()
                }]);

                if (error) {
                    console.error('Save error:', error);
                    // Save to localStorage as backup
                    const queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
                    queue.push(checkInData);
                    localStorage.setItem('offline_queue', JSON.stringify(queue));
                }

                return !error;
            } catch (e) {
                console.error('Error:', e);
                return false;
            }
        }

        // Update Current Time
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('ar-SA');
        }, 1000);

        // Connection Status
        window.addEventListener('online', () => {
            isOnline = true;
            updateConnectionStatus();
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            updateConnectionStatus();
        });

        function updateConnectionStatus() {
            const icon = document.getElementById('connIcon');
            const text = document.getElementById('connText');
            if (isOnline) {
                icon.className = 'fas fa-wifi text-emerald-400';
                text.textContent = 'متصل';
            } else {
                icon.className = 'fas fa-wifi-slash text-amber-400';
                text.textContent = 'بدون إنترنت (محفوظ محلياً)';
            }
        }

        // Check-in Handler
        document.getElementById('checkInBtn').addEventListener('click', async () => {
            const btn = document.getElementById('checkInBtn');

            if (!currentUser || !currentUser.id) {
                showError('❌ الرجاء تسجيل الدخول أولاً');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الفحص...</span>';

            if (!navigator.geolocation) {
                showError('❌ الهاتف لا يدعم GPS');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول (البصمة)</span>';
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const dist = calcDistance(pos.coords.latitude, pos.coords.longitude, clientLocation.lat, clientLocation.lng);
                
                updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude);

                if (dist <= geofenceRadius) {
                    const success = await saveCheckIn({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        dist: dist,
                        valid: true
                    });

                    if (success) {
                        document.getElementById('checkInTime').textContent = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                        document.getElementById('checkOutBtn').disabled = false;
                        showSuccess(`✅ تم تسجيل الدخول بنجاح! (${Math.round(dist)} متر)`);
                        await loadTodayCheckIns();
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول (البصمة)</span>';
                    }
                } else {
                    showError(`❌ فشل التسجيل: أنت بعيد ${Math.round(dist)} متر (المسموح 70 متر فقط)`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول (البصمة)</span>';
                }
            }, () => {
                showError('❌ فعّل GPS على الهاتف');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول (البصمة)</span>';
            }, { enableHighAccuracy: true, timeout: 10000 });
        });

        // Check-out Handler
        document.getElementById('checkOutBtn').addEventListener('click', async () => {
            const btn = document.getElementById('checkOutBtn');

            if (!currentUser || !currentUser.id) {
                showError('❌ الرجاء تسجيل الدخول أولاً');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>جاري الفحص...</span>';

            if (!navigator.geolocation) {
                showError('❌ الهاتف لا يدعم GPS');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج (البصمة)</span>';
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const dist = calcDistance(pos.coords.latitude, pos.coords.longitude, clientLocation.lat, clientLocation.lng);
                
                updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude);

                if (dist <= geofenceRadius) {
                    const success = await saveCheckIn({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        dist: dist,
                        valid: true
                    });

                    if (success) {
                        const checkInTime = new Date(document.getElementById('checkInTime').textContent);
                        const checkOutTime = new Date();
                        const hours = (checkOutTime - checkInTime) / (1000 * 60 * 60);
                        
                        document.getElementById('checkOutTime').textContent = checkOutTime.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                        document.getElementById('workHours').textContent = hours.toFixed(2) + ' ساعة';
                        
                        showSuccess(`✅ تم تسجيل الخروج بنجاح! عملت ${hours.toFixed(2)} ساعة`);
                        await loadTodayCheckIns();
                        btn.disabled = true;
                        btn.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج (البصمة)</span>';
                    }
                } else {
                    showError(`❌ فشل التسجيل: أنت بعيد ${Math.round(dist)} متر`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج (البصمة)</span>';
                }
            }, () => {
                showError('❌ فعّل GPS على الهاتف');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج (البصمة)</span>';
            }, { enableHighAccuracy: true, timeout: 10000 });
        });

        // Show Error
        function showError(msg) {
            const div = document.getElementById('statusMsg');
            const text = document.getElementById('statusText');
            text.textContent = msg;
            div.classList.remove('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        // Show Success
        function showSuccess(msg) {
            const div = document.getElementById('successMsg');
            const text = document.getElementById('successText');
            text.textContent = msg;
            div.classList.remove('hidden');
            document.getElementById('statusMsg').classList.add('hidden');
            setTimeout(() => div.classList.add('hidden'), 5000);
        }

        // Load Today's Check-ins
        async function loadTodayCheckIns() {
            try {
                if (!currentUser || !currentUser.id) {
                    return;
                }

                const today = new Date().toDateString();
                const { data } = await db.from('check_ins')
                    .select('*')
                    .eq('user_id', currentUser.id);

                const todayData = data?.filter(c => new Date(c.created_at).toDateString() === today) || [];
                todayCheckIns = todayData;

                const log = document.getElementById('checkinsLog');
                if (!todayData.length) {
                    log.innerHTML = '<p class="text-slate-400 text-center py-6">لا توجد بصمات اليوم</p>';
                    return;
                }

                log.innerHTML = todayData.map((c, i) => `
                    <div class="bg-slate-700/50 p-3 rounded-lg flex items-center justify-between">
                        <div>
                            <p class="font-bold">${i % 2 === 0 ? 'دخول' : 'خروج'}</p>
                            <p class="text-xs text-slate-400">${new Date(c.created_at).toLocaleTimeString('ar-SA')}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-400">${Math.round(c.distance_from_target)} متر</p>
                            <p class="text-xs ${c.is_valid ? 'text-emerald-400' : 'text-red-400'}">
                                ${c.is_valid ? '✓ ناجحة' : '✗ فاشلة'}
                            </p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Load check-ins error:', e);
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // Load user info
        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.id) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.name || 'موظف';
        }

        // Initialize
        updateConnectionStatus();
        loadUserInfo();
        initMap();
        loadLocations();
        // تحميل البصمات بعد تحميل معلومات المستخدم
        setTimeout(() => {
            if (currentUser && currentUser.id) {
                loadTodayCheckIns();
            }
        }, 500);
    </script>
</body>
</html>
